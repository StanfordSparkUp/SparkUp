<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sailor — SparkUp</title>
  <link rel="stylesheet" href="styles-form.css" />
  <script src="llm-integration.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="logo-container">
        <a href="index.html">
            <img src="/media/sparkup_logo.png" alt="SparkUp logo" />
          </a>
    </div>
  </header>

  <main class="form-section">
    <div class="container">
      <h1>Find the spark that moves you</h1>
      <p>Tell us who you are and what kind of project excites you. We’ll help you join something meaningful.</p>

      <form id="spark-form">
        <label for="name">Your full name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">University email</label>
        <input type="email" id="email" name="email" required />

        <label for="interests">What do you love doing outside of work?</label>
        <textarea id="interests" name="interests" rows="3"></textarea>

        <label for="motivation">What kind of project would you love to join?</label>
        <textarea id="motivation" name="motivation" rows="4" required></textarea>

        <label for="people">What kind of people do you want to collaborate with?</label>
        <textarea id="people" name="people" rows="3" required></textarea>

        <button type="submit" class="btn-submit">Continue</button>
      </form>
    </div>
  </main>
  <script>
    const form = document.getElementById('spark-form');
    
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      // Recopilar datos del formulario
      const formData = {
        role: 'sailor',
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        interests: document.getElementById('interests').value,
        motivation: document.getElementById('motivation').value,
        people: document.getElementById('people').value,
        timestamp: new Date().toISOString()
      };
      
      // Guardar en localStorage
      saveUserData(formData);
      
      // Mostrar loading
      const submitBtn = document.querySelector('.btn-submit');
      submitBtn.textContent = 'Processing...';
      submitBtn.disabled = true;
      
      try {
        // Enviar a LLM para procesamiento (usando la nueva integración)
        const llmResponse = await processWithRealLLM(formData);
        console.log('LLM Response:', llmResponse);
        
        // Guardar respuesta del LLM
        localStorage.setItem('sparkup_llm_response', JSON.stringify(llmResponse));
        
        // Redirigir a confirmación
        window.location.href = "confirmation.html";
      } catch (error) {
        console.error('Error processing with LLM:', error);
        
        // Restaurar botón y mostrar error
        submitBtn.textContent = 'Continue';
        submitBtn.disabled = false;
        alert('Hubo un error procesando tu información. Por favor intenta de nuevo.');
      }
    });
    
    function saveUserData(data) {
      // Guardar datos individuales
      localStorage.setItem('sparkup_user_data', JSON.stringify(data));
      
      // Agregar a lista de todos los usuarios (para el LLM)
      let allUsers = JSON.parse(localStorage.getItem('sparkup_all_users') || '[]');
      allUsers.push(data);
      localStorage.setItem('sparkup_all_users', JSON.stringify(allUsers));
      
      console.log('Datos guardados:', data);
    }
    
    // Esta función ya no es necesaria, se usa processWithRealLLM del archivo llm-integration.js
  </script>
</body>
</html>
